[project]
name = "trading-agent-mcp"
version = "0.1.0"
description = "MCP server exposing investor-db data (US equities, SEC filings, financials, prices, insider trades) to LLM agents via Streamable HTTP / stdio."
requires-python = ">=3.12"
authors = [
    { name = "AAAZZZR", email = "rudy871211@gmail.com" }
]
dependencies = [
    "asyncpg>=0.30.0",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "sqlparse>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.12",
]
